        /**
         * Reusable Card Component

        function Card({ children, className = '', hover = true, glow = false, onClick, ...props }) {
            const hoverClasses = hover ? 'hover:border-slate-700 hover:-translate-y-1 transition-all duration-300' : '';

                    className={`p-5 sm:p-7 rounded-2xl bg-slate-900/50 border ${glowClasses} backdrop-blur-sm shadow-xl flex flex-col justify-between ${hoverClasses} ${className}`}
                    {...props}
                >
                    {children}
                </div>
            );
        }

        /**
         * Reusable SectionHeader Component
         */

                cyan: 'bg-cyan-500',
                purple: 'bg-purple-500',

                amber: 'bg-amber-500'
            };
            const barColor = colorMap[accentColor] || 'bg-indigo-500';

            return (
                <div className={`flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 sm:mb-8 ${className}`}>
                    <div className="flex items-center gap-3">
                        <span className={`w-2.5 h-7 rounded-full ${barColor} inline-block shrink-0`}></span>
                        <div>

                            )}

                    {action && <div className="flex items-center gap-2">{action}</div>}
                </div>
            );
        }

        /**
         * Reusable Button Component
         */
        function Button({
            children,
            variant = 'primary',
            size = 'md',
            icon,
            className = '',
            disabled = false,
            onClick,
            type = 'button',
            as = 'button',
            href,
            ...props
        }) {
            const variantStyles = {
                primary: 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/25 hover:shadow-indigo-600/40',
                secondary: 'bg-slate-900 text-slate-200 border border-slate-800 hover:border-slate-700 hover:bg-slate-800',
                emerald: 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20 hover:shadow-emerald-600/30',
                danger: 'bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/20',
                ghost: 'bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30'
            };

            const sizeStyles = {
                sm: 'px-3 py-1.5 text-xs rounded-lg',
                md: 'px-4 py-2.5 text-sm rounded-xl',
                lg: 'px-6 py-3.5 text-base rounded-xl'
            };

            const baseStyles = 'inline-flex items-center justify-center gap-2 font-semibold transition-all cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed';
            const classes = `${baseStyles} ${variantStyles[variant] || variantStyles.primary} ${sizeStyles[size] || sizeStyles.md} ${className}`;

            if (as === 'a') {
                return (
                    <a href={href} className={classes} {...props}>
                        {children}
                        {icon}
                    </a>
                );
            }

            return (
                <button type={type} disabled={disabled} onClick={onClick} className={classes} {...props}>
                    {children}
                    {icon}
                </button>
            );
        }

        /**
         * Reusable Modal Component
         */
        function Modal({ isOpen, onClose, title, icon, children, footer, maxWidth = 'max-w-lg' }) {
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isOpen) onClose();
                };
                if (isOpen) {
                    document.body.style.overflow = 'hidden';
                    window.addEventListener('keydown', handleKeyDown);
                } else {
                    document.body.style.overflow = '';
                }
                return () => {
                    document.body.style.overflow = '';
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, [isOpen, onClose]);

            if (!isOpen) return null;

            return (
                <div
                    className="modal-overlay"
                    onClick={(e) => {
                        if (e.target === e.currentTarget) onClose();
                    }}
                >
                    <div className={`bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-7 ${maxWidth} w-full shadow-2xl relative animate-[slideDown_0.2s_ease-out]`}>
                        <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
                            <h3 className="text-base sm:text-lg font-bold text-white flex items-center gap-2 truncate pr-2">
                                {icon && <span>{icon}</span>}
                                <span>{title}</span>
                            </h3>
                            <button
                                type="button"
                                onClick={onClose}
                                className="text-slate-400 hover:text-white text-lg font-bold p-1 cursor-pointer transition-colors"
                            >
                                ✕
                            </button>
                        </div>
                        <div className="modal-body">{children}</div>
                        {footer && (
                            <div className="mt-5 pt-3 border-t border-slate-800 flex justify-end gap-2">
                                {footer}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /**
         * Team Component (Uses Reusable Card, Button, Badge & Modal)
         */
        function Team() {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [alert, setAlert] = useState(null);

            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isPostsModalOpen, setIsPostsModalOpen] = useState(false);
            const [selectedUser, setSelectedUser] = useState(null);
            const [userPosts, setUserPosts] = useState([]);
            const [postsLoading, setPostsLoading] = useState(false);

            const [formData, setFormData] = useState({
                name: '', username: '', company: '', email: '', phone: '', website: ''
            });
            const [submitting, setSubmitting] = useState(false);

            const gradientColors = [
                'from-blue-600 to-indigo-600',
                'from-emerald-600 to-teal-600',
                'from-purple-600 to-pink-600',
                'from-amber-600 to-orange-600',
                'from-cyan-600 to-blue-600',
                'from-rose-600 to-red-600'
            ];

            const getInitials = (name) => {
                if (!name) return 'U';
                return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
            };

            const triggerAlert = (message, type = 'success') => {
                setAlert({ message, type });
                setTimeout(() => setAlert(null), 6000);
            };

            // 1. GET /users
            const loadUsers = async () => {
                setLoading(true);
                try {
                    const res = await fetch('https://jsonplaceholder.typicode.com/users');
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    setUsers(data);
                } catch (err) {
                    triggerAlert(`მონაცემების ჩატვირთვა ვერ მოხერხდა: ${err.message}`, 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadUsers();
            }, []);

            // 2. GET /users/:id/posts
            const handleViewPosts = async (user) => {
                setSelectedUser(user);
                setIsPostsModalOpen(true);
                setPostsLoading(true);
                setUserPosts([]);

                try {
                    const res = await fetch(`https://jsonplaceholder.typicode.com/users/${user.id}/posts`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const posts = await res.json();
                    setUserPosts(posts);
                    triggerAlert(`წარმატებით ჩაიტვირთა ${posts.length} პოსტი (${user.name}) - GET 200 OK`, 'info');
                } catch (err) {
                    triggerAlert(`პოსტების ჩატვირთვის შეცდომა: ${err.message}`, 'error');
                } finally {
                    setPostsLoading(false);
                }
            };

            // 3. DELETE /users/:id
            const handleDeleteUser = async (user) => {
                if (!window.confirm(`ნამდვილად გსურთ წაშალოთ "${user.name}"? (DELETE მეთოდი)`)) return;

                try {
                    const res = await fetch(`https://jsonplaceholder.typicode.com/users/${user.id}`, {
                        method: 'DELETE'
                    });

                    if (res.ok) {
                        setUsers(prev => prev.filter(u => u.id !== user.id));
                        triggerAlert(`თანამშრომელი "${user.name}" წარმატებით წაიშალა! (DELETE 200 OK)`, 'success');
                    } else {
                        throw new Error(`HTTP ${res.status}`);
                    }

                    triggerAlert(`წაშლის შეცდომა: ${err.message}`, 'error');
                }
            };

            // 4. POST /users
            const handleAddUserSubmit = async (e) => {
                e.preventDefault();
                setSubmitting(true);

                const newEmployee = {
                    name: formData.name,
                    username: formData.username || 'newdev',
                    email: formData.email,
                    phone: formData.phone || '+995 555 123 456',
                    website: formData.website || 'portfolio.ge',
                    company: {
                        name: formData.company || 'Tech Solutions',
                        catchPhrase: 'Full Stack Development'
                    },
                    address: { city: 'Tbilisi' }

                    const res = await fetch('https://jsonplaceholder.typicode.com/users', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                        body: JSON.stringify(newEmployee)
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const created = await res.json();

                    setUsers(prev => [{ ...created, isNew: true }, ...prev]);
                    triggerAlert(`ახალი თანამშრომელი "${created.name}" წარმატებით დაემატა! ID: #${created.id} (POST 201 Created)`, 'success');

                    setFormData({ name: '', username: '', company: '', email: '', phone: '', website: '' });

                                : alert.type === 'error'
                                ? 'bg-rose-950/70 border-rose-500/50 text-rose-200'

                                <span>{alert.type === 'success' ? '✅' : alert.type === 'error' ? '❌' : 'ℹ️'}</span>

                            </div>
                            <button
                                type="button"
                                onClick={() => setAlert(null)}
                                className="text-xs opacity-70 hover:opacity-100 font-bold px-1.5 py-0.5"
                            >
                                ✕
                            </button>
                        </div>
                    )}

                    {/* Loading State */}
                    {loading ? (
                        <div className="flex flex-col items-center justify-center py-12 text-slate-400 gap-3">
                            <svg className="animate-spin w-8 h-8 text-indigo-500" fill="none" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" />
                            </svg>
                            <span className="text-sm font-mono">იტვირთება თანამშრომლების სია (GET /users)...</span>
                        </div>
                    ) : (
                        <div className="team-grid grid gap-5 sm:gap-6">
                            {users.map((user) => {
                                const color = gradientColors[user.id % gradientColors.length] || 'from-indigo-600 to-cyan-600';

                                return (
                                    <Card

                                                    <div className="min-w-0">
                                                        <h3 className="text-base sm:text-lg font-bold text-white truncate group-hover:text-indigo-300 transition-colors">
                                                            {user.name}

                                                    <Badge variant="emerald">ახალი</Badge>

                                                    <Badge variant="slate">#{user.id}</Badge>

                                            </div>

                                            <div className="p-3 rounded-xl bg-slate-950/60 border border-slate-800/60 mb-4 text-xs">
                                                <div className="text-slate-400 flex items-center gap-1.5 font-medium mb-1">
                                                    <span>🏢</span>
                                                    <span className="text-white font-semibold">{user.company?.name || 'Freelance'}</span>
                                                </div>
                                                <p className="text-slate-400 italic line-clamp-1">
                                                    "{user.company?.catchPhrase || 'Software Specialist'}"

                                            </div>

                                            <ul className="space-y-2 text-xs text-slate-300 mb-5 font-mono">
                                                <li className="flex items-center gap-2 truncate">

                                                    <span className="text-slate-500">📞</span>
                                                    <span className="truncate">{user.phone}</span>
                                                </li>
                                                <li className="flex items-center gap-2 truncate">
                                                    <span className="text-slate-500">🌐</span>
                                                    <a href={`https://${user.website}`} target="_blank" rel="noopener noreferrer" className="hover:text-cyan-400 transition-colors truncate">
                                                        {user.website}

                                                <li className="flex items-center gap-2 truncate">
                                                    <span className="text-slate-500">📍</span>
                                                    <span className="truncate">{user.address?.city || 'Georgia'}</span>
                                                </li>
                                            </ul>
                                        </div>

                                        <div className="flex items-center gap-2 pt-4 border-t border-slate-800/60">
                                            <Button
                                                variant="ghost"
                                                size="sm"
                                                className="flex-1"
                                                onClick={() => handleViewPosts(user)}
                                                icon={
                                                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                                                    </svg>
                                                }
                                            >
                                                პოსტები (GET)
                                            </Button>

                                            <Button
                                                variant="danger"
                                                size="sm"
                                                onClick={() => handleDeleteUser(user)}
                                                title="თანამშრომლის წაშლა (DELETE)"
                                            >
                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                </svg>
                                            </Button>
                                        </div>
                                    </Card>
                                );
                            })}
                        </div>
                    )}

                    {/* მოდალი 1: პოსტების ნახვა */}
                    <Modal
                        isOpen={isPostsModalOpen}
                        onClose={() => setIsPostsModalOpen(false)}
                        title={`${selectedUser?.name || 'მომხმარებლის'}-ის პოსტები`}
                        footer={
                            <Button variant="secondary" size="sm" onClick={() => setIsPostsModalOpen(false)}>
                                დახურვა
                            </Button>
                        }
                    >
                        {postsLoading ? (
                            <div className="flex items-center justify-center py-10 text-slate-400">
                                <svg className="animate-spin w-6 h-6 text-indigo-500 mr-2" fill="none" viewBox="0 0 24 24">
                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" />
                                </svg>
                                <span>იტვირთება პოსტები (GET /users/{selectedUser?.id}/posts)...</span>
                            </div>
                        ) : userPosts.length === 0 ? (
                            <p className="text-slate-400 text-sm text-center py-6">პოსტები ვერ მოიძებნა.</p>

                                {userPosts.slice(0, 5).map((post) => (
                                    <div key={post.id} className="p-4 rounded-xl bg-slate-950/70 border border-slate-800/80">
                                        <h4 className="text-sm font-bold text-indigo-300 capitalize mb-1">{post.title}</h4>
                                        <p className="text-xs text-slate-400 leading-relaxed">{post.body}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </Modal>

                    {/* მოდალი 2: ახალი თანამშრომლის დამატება */}
                    <Modal

                                />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-medium text-slate-300 mb-1">მეტსახელი</label>
                                    <input
                                        type="text"
                                        placeholder="gio_dev"

                                        onChange={(e) => setFormData({ ...formData, username: e.target.value })}

        /**
         * Contact Component (Uses Reusable Card & Button)
         */
        function Contact() {
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [message, setMessage] = useState('');
            const [status, setStatus] = useState(null);
            const [submitting, setSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSubmitting(true);

                const payload = {
                    title: name,
                    body: message,
                    email: email,
                    userId: 1
                };

                try {
                    const res = await fetch('https://jsonplaceholder.typicode.com/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();

                    setStatus({
                        type: 'success',
                        text: `შეტყობინება წარმატებით გაიგზავნა! ID: #${data.id} (POST 201 Created)`
                    });
                    setName('');
                    setEmail('');
                    setMessage('');
                } catch (err) {
                    setStatus({
                        type: 'error',
                        text: `შეტყობინების გაგზავნა ვერ მოხერხდა: ${err.message}`
                    });
                } finally {
                    setSubmitting(false);
                    setTimeout(() => setStatus(null), 7000);
                }
            };

            return (
                <section id="contact" className="scroll-mt-20 sm:scroll-mt-24">
                    <SectionHeader title="კონტაქტი" accentColor="emerald" />

                    <div className="contact-layout grid gap-6 sm:gap-8 items-start">
                        {/* საკონტაქტო ინფო */}
                        <div className="space-y-4 sm:space-y-6">
                            <p className="text-slate-300 text-base leading-relaxed">
                                დამიკავშირდით პროექტების ან თანამშრომლობისთვის:
                            </p>

                            <address className="not-italic space-y-3 sm:space-y-4">
                                <a
                                    href={`mailto:${personalInfo.email}`}
                                    className="contact-link flex items-center gap-3.5 p-3.5 sm:p-4 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-indigo-500/50 hover:bg-slate-800/60 transition-all group"
                                >
                                    <span className="w-10 h-10 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:scale-110 transition-transform shrink-0">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                        </svg>
                                    </span>
                                    <div className="min-w-0 flex-1">
                                        <span className="text-xs text-slate-400 block">Email</span>
                                        <span className="contact-link-text text-white font-medium text-xs sm:text-sm truncate block group-hover:text-indigo-400 transition-colors">
                                            {personalInfo.email}
                                        </span>
                                    </div>
                                </a>

                                <a
                                    href={personalInfo.github}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="contact-link flex items-center gap-3.5 p-3.5 sm:p-4 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-indigo-500/50 hover:bg-slate-800/60 transition-all group"
                                >
                                    <span className="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-white group-hover:scale-110 transition-transform shrink-0">
                                        <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                                        </svg>
                                    </span>
                                    <div className="min-w-0 flex-1">
                                        <span className="text-xs text-slate-400 block">GitHub</span>
                                        <span className="contact-link-text text-white font-medium text-xs sm:text-sm truncate block group-hover:text-indigo-400 transition-colors">
                                            {personalInfo.githubUsername}
                                        </span>
                                    </div>
                                </a>
                            </address>
                        </div>

                        {/* ფორმა (Uses Reusable Card) */}
                        <Card hover={false} className="contact-form-wrapper p-5 sm:p-8">
                            <h3 className="text-lg font-bold text-white mb-5 sm:mb-6 flex items-center gap-2">
                                <span>✉️</span> შეტყობინების გაგზავნა (POST)
                            </h3>

                            {status && (
                                <div className={`p-4 rounded-xl border text-sm mb-4 ${
                                    status.type === 'success'
                                        ? 'bg-emerald-950/70 border-emerald-500/50 text-emerald-200'
                                        : 'bg-rose-950/70 border-rose-500/50 text-rose-200'
                                }`}>
                                    {status.text}
                                </div>
                            )}

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label htmlFor="name" className="block text-sm font-medium text-slate-300 mb-1.5">
                                        სახელი:
                                    </label>
                                    <input
                                        type="text"
                                        id="name"
                                        name="name"
                                        required
                                        placeholder="თქვენი სახელი"
                                        value={name}
                                        onChange={(e) => setName(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-base sm:text-sm"
                                    />
                                </div>

                                <div>
                                    <label htmlFor="email" className="block text-sm font-medium text-slate-300 mb-1.5">
                                        ელ-ფოსტა:
                                    </label>
                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        required
                                        placeholder="name@example.com"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-base sm:text-sm"
                                    />
                                </div>

                                <div>
                                    <label htmlFor="message" className="block text-sm font-medium text-slate-300 mb-1.5">
                                        შეტყობინება:
                                    </label>
                                    <textarea
                                        id="message"
                                        name="message"
                                        rows="4"
                                        required
                                        placeholder="თქვენი შეტყობინება..."
                                        value={message}
                                        onChange={(e) => setMessage(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl bg-slate-950/80 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-base sm:text-sm resize-none"
                                    ></textarea>
                                </div>

                                <div>
                                    <Button
                                        type="submit"
                                        variant="primary"
                                        size="lg"
                                        disabled={submitting}
                                        className="w-full sm:w-auto"
                                        icon={
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                            </svg>
                                        }
                                    >
                                        {submitting ? 'იგზავნება...' : 'გაგზავნა (POST)'}
                                    </Button>
                                </div>
                            </form>
                        </Card>
                    </div>
                </section>
            );
        }

        /**
         * Footer Component
         */
        function Footer() {
            return (
                <footer className="mt-16 sm:mt-20 border-t border-slate-800/80 bg-slate-950/60 backdrop-blur-md py-6 sm:py-8">
                    <div className="footer-content max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3 text-xs sm:text-sm text-slate-500">
                        <p>&copy; 2026 ლუკა სულაძე. ყველა უფლება დაცულია.</p>
                        <p className="font-mono text-xs text-slate-600">Built with React &amp; Tailwind CSS</p>
                    </div>
                </footer>
            );
        }


        /* ==========================================================================
           4. მთავარი App კომპონენტი
           ========================================================================== */
        function App() {
            return (
                <div className="min-h-screen">
                    {/* ფონური განათებები */}
                    <div className="fixed top-0 left-1/4 w-72 sm:w-96 h-72 sm:h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
                    <div className="fixed top-1/2 right-1/4 w-72 sm:w-96 h-72 sm:h-96 bg-cyan-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
                    <div className="fixed bottom-0 left-1/3 w-72 sm:w-96 h-72 sm:h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

                    {/* ნავიგაციის კომპონენტი */}
                    <Navbar />

                    {/* გვერდის სექციები */}
                    <main className="main-container max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 space-y-16 sm:space-y-24">
                        <Hero />
                        <hr className="border-slate-800/60" />

                        <About />
                        <hr className="border-slate-800/60" />

                        <Skills />
                        <hr className="border-slate-800/60" />

                        <Projects />
                        <hr className="border-slate-800/60" />

                        <Team />
                        <hr className="border-slate-800/60" />

                        <Contact />
                    </main>

                    {/* ფუტერის კომპონენტი */}
                    <Footer />
                </div>
            );
        }

        // React-ის რენდერი
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>

</html>
